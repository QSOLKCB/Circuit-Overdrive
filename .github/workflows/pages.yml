name: Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REPLAY_REVISION: ${{ github.sha }}

# Keep the matching public site in place while its browser checks run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test simulation, course rules and vendored source hashes
        run: node --test tests/*.test.mjs
      - name: Assemble and validate the allowlisted site
        run: node --experimental-vm-modules scripts/package-site.mjs "$RUNNER_TEMP/public/Circuit-Overdrive"
      - name: Build and independently verify offline release candidate
        run: |
          python3 tests/test_offline_release.py
          python3 scripts/offline-release.py build "$RUNNER_TEMP/offline"
          python3 scripts/offline-release.py verify "$RUNNER_TEMP/offline"
          name="Circuit-Overdrive-${GITHUB_SHA}.zip"
          python3 -m zipfile -e "$RUNNER_TEMP/offline/$name" "$RUNNER_TEMP/unpacked"
          diff -r --exclude=START-HERE.txt --exclude=RELEASE.json "$RUNNER_TEMP/public/Circuit-Overdrive" "$RUNNER_TEMP/unpacked/Circuit-Overdrive"
          cat "$RUNNER_TEMP/offline/$name.sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the verified ZIP and checksum for owner review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/offline
          if-no-files-found: error
          retention-days: 14
      - name: Install browser test driver outside the package
        run: npm install --prefix "$RUNNER_TEMP/driver" --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Drive both courses under the Pages path
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/driver/node_modules/playwright/index.mjs
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$RUNNER_TEMP/unpacked" > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          url=http://127.0.0.1:8000/Circuit-Overdrive/
          curl --retry 10 --retry-connrefused --retry-delay 1 -fs "$url" -o /dev/null || {
            cat "$RUNNER_TEMP/server.log"
            exit 1
          }
          bash scripts/browser-pages.sh "$url" "$RUNNER_TEMP/evidence"
      - name: Preserve local browser reports and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-browser-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14
      - name: Upload tested site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/public/Circuit-Overdrive

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  public-browser:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser test driver
        run: npm install --prefix "$RUNNER_TEMP/driver" --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify public assets and drive both courses
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/driver/node_modules/playwright/index.mjs
          CHROME_BIN: /usr/bin/google-chrome
          PAGE_URL: ${{ needs.deploy.outputs.url }}
        run: |
          bash scripts/browser-pages.sh "${PAGE_URL%/}/" "$RUNNER_TEMP/evidence" --wait-for-cdn
          printf 'Public browser passed for `%s` at [%s](%s). [Workflow run](%s/%s/actions/runs/%s).\n' \
            "$GITHUB_SHA" "$PAGE_URL" "$PAGE_URL" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve public reports and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-browser-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14
