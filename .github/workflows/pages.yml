name: Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Keep the matching public site in place while its browser checks run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      archive-id: ${{ steps.archive.outputs.artifact-id }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test simulation, course rules and vendored source hashes
        run: node --test tests/*.test.mjs
      - name: Verify browser shard coverage
        run: bash tests/browser-pages-shards.sh
      - name: Assemble and validate the allowlisted site
        run: node --experimental-vm-modules scripts/package-site.mjs "$RUNNER_TEMP/public/Circuit-Overdrive"
      - name: Build and independently verify offline release candidate
        run: |
          python3 tests/test_offline_release.py
          python3 scripts/offline-release.py build "$RUNNER_TEMP/offline"
          python3 scripts/offline-release.py verify "$RUNNER_TEMP/offline"
          name="Circuit-Overdrive-${GITHUB_SHA}.zip"
          python3 -m zipfile -e "$RUNNER_TEMP/offline/$name" "$RUNNER_TEMP/unpacked"
          diff -r --exclude=START-HERE.txt --exclude=RELEASE.json "$RUNNER_TEMP/public/Circuit-Overdrive" "$RUNNER_TEMP/unpacked/Circuit-Overdrive"
          cat "$RUNNER_TEMP/offline/$name.sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the verified ZIP and checksum for owner review
        id: archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/offline
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Stage the Pages artifact for verified deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public/Circuit-Overdrive

  local-browser:
    needs: package
    uses: ./.github/workflows/browser-checks.yml
    with:
      target: local
      archive-id: ${{ needs.package.outputs.archive-id }}

  # Keep the existing required check. A skipped or failed dependency must fail it.
  verify:
    if: always()
    needs: [package, local-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require the package and every browser shard
        env:
          PACKAGE: ${{ needs.package.result }}
          BROWSER: ${{ needs.local-browser.result }}
        run: '[[ "$PACKAGE" == success && "$BROWSER" == success ]]'

  deploy:
    needs: [package, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ needs.package.outputs.attempt }}

  public-browser:
    needs: deploy
    uses: ./.github/workflows/browser-checks.yml
    with:
      target: public
      page-url: ${{ needs.deploy.outputs.url }}
